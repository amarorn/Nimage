apiVersion: apps/v1
kind: Deployment
metadata:
  name: nimage-app
  namespace: nimage
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nimage
  template:
    metadata:
      labels:
        app: nimage
    spec:
      containers:
      - name: nimage
        image: registry.digitalocean.com/nimage/app:latest
        ports:
        - containerPort: 3001
        env:
        - name: MONGODB_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: mongodb-secret
              key: mongodb-root-password
        envFrom:
        - configMapRef:
            name: nimage-config
        resources:
          requests:
            cpu: "200m"
            memory: "256Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
        livenessProbe:
          httpGet:
            path: /api/health
            port: 3001
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /api/health
            port: 3001
          initialDelaySeconds: 5
          periodSeconds: 5 