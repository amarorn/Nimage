apiVersion: apps/v1
kind: Deployment
metadata:
  name: nimage-app
  namespace: nimage-prd
spec:
  replicas: 3
  selector:
    matchLabels:
      app: nimage
  template:
    metadata:
      labels:
        app: nimage
    spec:
      containers:
      - name: nimage-app
        image: nimage-app:latest
        ports:
        - containerPort: 3001
        envFrom:
        - configMapRef:
            name: nimage-config
        resources:
          requests:
            cpu: "500m"
            memory: "512Mi"
          limits:
            cpu: "1000m"
            memory: "1Gi"
        livenessProbe:
          httpGet:
            path: /api/health
            port: 3001
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /api/health
            port: 3001
          initialDelaySeconds: 5
          periodSeconds: 5 