apiVersion: apps/v1
kind: Deployment
metadata:
  name: nimage-app
  namespace: nimage-dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nimage
  template:
    metadata:
      labels:
        app: nimage
    spec:
      containers:
      - name: nimage-app
        image: nimage-app:dev
        imagePullPolicy: Never
        ports:
        - containerPort: 3001
        envFrom:
        - configMapRef:
            name: nimage-config
        resources:
          requests:
            cpu: "100m"
            memory: "256Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
        livenessProbe:
          httpGet:
            path: /api/health
            port: 3001
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /api/health
            port: 3001
          initialDelaySeconds: 5
          periodSeconds: 5 